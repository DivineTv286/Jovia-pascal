<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#14071b">
    <meta name="robots" content="noindex">

    <title>Get Started — JOVIA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 15% 20%, #38174366, transparent 55%),
                #14071b;
            color: #faf7fc;
            font-family: "DM Sans", sans-serif;
        }

        a { color: inherit; text-decoration: none; }
        button, input { font: inherit; }
        a, button, input { outline-offset: 4px; }

        header {
            width: min(1160px, calc(100% - 40px));
            margin: auto;
            padding: 22px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #ffffff12;
        }

        .logo {
            width: 145px;
            height: 52px;
            object-fit: contain;
            object-position: left center;
        }

        .back { color: #bcacc7; font-size: 13px; }
        .back i { margin-right: 7px; }

        main {
            width: min(620px, calc(100% - 32px));
            margin: 40px auto 60px;
        }

        .access-panel, .form-card {
            padding: 35px;
            border: 1px solid #ffffff15;
            border-radius: 25px;
            background: linear-gradient(145deg, #ffffff0d, #ffffff03);
        }

        .access-panel { margin-bottom: 22px; }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #f2db6f;
        }

        .eyebrow::before {
            content: "";
            width: 7px;
            height: 7px;
            background: #36db69;
            border-radius: 50%;
        }

        h1, h2 { font-family: "Manrope", sans-serif; }

        h1 {
            margin: 23px 0 18px;
            font-size: 45px;
            line-height: 1.13;
            letter-spacing: -2px;
        }

        h1 span { color: #f0bb1e; }

        p {
            color: #bcacc7;
            font-size: 13px;
            line-height: 1.8;
        }

        h2 {
            font-size: 24px;
            letter-spacing: -.7px;
            margin: 0 0 12px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 15px;
            margin-top: 25px;
        }

        .full { grid-column: 1 / -1; }

        label {
            display: block;
            color: #e5dce9;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .input-wrap { position: relative; }

        .input-wrap > i {
            position: absolute;
            left: 14px;
            top: 16px;
            color: #ad9ab9;
            pointer-events: none;
        }

        input:not([type="checkbox"]) {
            width: 100%;
            min-height: 49px;
            padding: 14px 14px 14px 40px;
            border: 1px solid #ffffff20;
            border-radius: 10px;
            background: #110719;
            color: white;
            font-size: 13px;
        }

        input::placeholder { color: #81708c; }
        input:focus { outline: 2px solid #f0bb1e77; }

        .conditions {
            padding: 15px;
            margin-top: 24px;
            border: 1px solid #f0bb1e30;
            border-radius: 12px;
            background: #f0bb1e07;
        }

        .conditions strong { color: #f2db6f; font-size: 12px; }
        .conditions p { font-size: 11px; margin: 9px 0 0; }

        .consent {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 20px;
            color: #bcacc7;
            font-size: 11px;
            line-height: 1.7;
        }

        .consent input {
            margin-top: 4px;
            accent-color: #f0bb1e;
            flex-shrink: 0;
        }

        .submit-button {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin-top: 22px;
            min-height: 52px;
            border: 0;
            border-radius: 11px;
            background: linear-gradient(110deg, #f0bb1e, #f2db6f);
            color: #25152d;
            font-weight: 700;
            cursor: pointer;
        }

        .preview-note {
            padding: 13px;
            border: 1px solid #ffffff15;
            border-radius: 10px;
            font-size: 11px;
        }

        .return-link { text-align: center; margin-top: 20px; }
        .return-link a { color: #f2db6f; text-decoration: underline; }

        footer {
            text-align: center;
            padding: 20px;
            color: #927f9e;
            font-size: 11px;
        }

        @media (max-width: 560px) {
            main { margin-top: 25px; }
            .access-panel, .form-card { padding: 25px; }
            h1 { font-size: 38px; }
            .form-grid { grid-template-columns: 1fr; }
            .logo { width: 125px; height: 45px; }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" aria-label="JOVIA homepage">
        <img class="logo"
             src="logo.png"
             alt="JOVIA"
             width="145"
             height="52">
    </a>

    <a href="index.html" class="back">
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
        Back
    </a>
</header>

<main>
    <section class="access-panel">
        <div class="eyebrow">YOUR JOVIA JOURNEY</div>

        <h1>
            You're one step<br>
            <span>closer.</span>
        </h1>

        <p>
            Explore your dashboard, then choose one of the
            two activation packages to unlock available activities.
        </p>
    </section>

    <section class="form-card">
        <h2>Get started</h2>

        <form id="registerForm">
            <div class="form-grid">
                <div class="full">
                    <label for="full_name">Full name</label>

                    <div class="input-wrap">
                        <i class="bi bi-person" aria-hidden="true"></i>

                        <input id="full_name"
                               name="full_name"
                               type="text"
                               autocomplete="name"
                               maxlength="120"
                               placeholder="Enter your full name"
                               >
                    </div>
                </div>

                <div>
    <label for="email">Email address</label>

    <div class="input-wrap">
        <i class="bi bi-envelope" aria-hidden="true"></i>

        <input id="email"
               name="email"
               type="email"
               autocomplete="email"
               maxlength="190"
               placeholder="you@example.com"
               >
    </div>
</div>

<div>
    <label for="phone">Phone number</label>

    <div class="input-wrap">
        <i class="bi bi-phone" aria-hidden="true"></i>

        <input id="phone"
               name="phone"
               type="tel"
               autocomplete="tel"
               maxlength="30"
               pattern="[+0-9() \-]{7,30}"
               title="Enter a phone number using 7–30 digits, spaces, parentheses or a leading plus."
               placeholder="080..."
               >
    </div>
</div>

            </div>

            <div class="conditions">
                <strong>No referrals are required.</strong>
            </div>

            

            <button class="submit-button" type="submit">
                Continue to Dashboard
                <i class="bi bi-arrow-right" aria-hidden="true"></i>
            </button>

            <p id="formMessage" role="status"></p>
        </form>

        <noscript>
            <p>
                JavaScript is needed to remember your preview name.
                <a href="dashboard.html">Open the dashboard directly</a>.
            </p>
        </noscript>

        <p class="return-link">
            <a href="dashboard.html">already registered? Signin</a>
        </p>
    </section>
</main>

<footer>
    © <span id="year"></span> JOVIA Network.
    Every second creates value.
</footer>

<script>
    const storageKey = 'joviaPreviewVisitor';
    const form = document.getElementById('registerForm');
    const nameInput = document.getElementById('full_name');

    document.getElementById('year').textContent =
        new Date().getFullYear();

    // Returning preview visitor: skip the form in the same tab.
    try {
        const saved = JSON.parse(
            sessionStorage.getItem(storageKey) || 'null'
        );

        if (
            saved &&
            typeof saved.name === 'string' &&
            saved.name.trim() !== '' &&
            saved.preview === true
        ) {
            window.location.replace('dashboard.html');
        }
    } catch (_) {
        // Storage is optional; the form still works without it.
    }

    form.addEventListener('submit', event => {
        event.preventDefault();

        const name = nameInput.value.trim();

        if (!name) {
            nameInput.setCustomValidity('Enter your name.');
            nameInput.reportValidity();
            return;
        }

        nameInput.setCustomValidity('');

        try {
            sessionStorage.setItem(
                storageKey,
                JSON.stringify({
                    name,
                    preview: true
                })
            );
        } catch (_) {
            // Continue even if browser storage is unavailable.
        }

        window.location.assign('dashboard.html');
    });

    nameInput.addEventListener('input', () => {
        nameInput.setCustomValidity('');
    });
</script>

<script>
    document.addEventListener("contextmenu", function(e){
    e.preventDefault();
});

document.addEventListener("keydown", function(e){

    if (
        e.key === "F12" ||

        (e.ctrlKey && e.shiftKey && e.key === "I") ||

        (e.ctrlKey && e.shiftKey && e.key === "J") ||

        (e.ctrlKey && e.shiftKey && e.key === "C") ||

        (e.ctrlKey && e.key === "U") ||

        (e.ctrlKey && e.key === "S")

    ){

        e.preventDefault();
        return false;

    }

});

document.querySelectorAll("img").forEach(img=>{

    img.setAttribute("draggable","false");

});

document.addEventListener("copy",function(e){

    e.preventDefault();

});

document.addEventListener("cut",function(e){

    e.preventDefault();

});

document.addEventListener("paste",function(e){

    e.preventDefault();

});

</script>
<style>
    body{

    user-select:none;
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;

}
</style>

</body>
</html>
